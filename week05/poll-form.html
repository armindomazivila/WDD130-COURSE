<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Page</title>
    <link rel="stylesheet" href="poll-form.css">
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <main>
        <h2>User Poll</h2>
        <form>

            <div class="form-item column2">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-item column2">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required>
            </div>

            <div class="form-item column1">
                <label for="browser">What is your favorite browser?</label>
                <select name="browser" id="browser">
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                    <option value="chrome">Chrome</option>
                    <option value="brave">Brave</option>
                    <option value="opera">Opera</option>
                    <option value="firefox">Firefox</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-item column1">
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>

            <div class="form-item">
                <label for="feedback">List the places you have lived.</label>
                <textarea id="feedback" name="feedback" rows="5"
                  placeholder="Enter the places you have lived here..."></textarea>
            </div>

            <button type="submit">Submit Poll</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 | HTML Form - use Poll Activity| Armindo Mazivila</p>
    </footer>

</body>

</html>
